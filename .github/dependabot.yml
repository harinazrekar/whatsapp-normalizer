version: 2

updates:
  # Python dependencies. The manifests are read from disk, so nothing here has
  # to know what is pinned in requirements*.txt.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      # Minor/patch bumps arrive as one PR; majors stay separate so a breaking
      # change is reviewed on its own.
      python-minor-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
