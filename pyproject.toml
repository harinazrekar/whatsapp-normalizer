# Tooling configuration only.
#
# There is deliberately no [project] / [build-system] section here: the service
# is not installed as a package, it is run from the repo root as `app.main:app`
# (see Dockerfile and docker-compose.yml). Adding a [project] table would make
# `pip install -e .` look sensible and quietly change how `app` is imported.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is enforced by the formatter, not the linter
    "B008", # FastAPI's Depends()/Query() defaults are the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests may shadow builtins in fixtures and use asserts freely.
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
# Moderate strictness: several dependencies (slowapi, fakeredis, prometheus
# client shims) ship no or partial type information, so full `strict` mode is
# noise rather than signal here.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
show_error_codes = true
pretty = true
exclude = "^(tests/|\\.venv/|build/)"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# `app` is imported as a top-level package but the repo is not pip-installed.
# Bare `pytest` (what CI and `make test` run) does not put the CWD on sys.path --
# only `python -m pytest` does -- so without this the whole suite fails to import.
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
